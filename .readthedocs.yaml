# Read the Docs builds a preview of the site for each pull request.
# GitHub Pages still serves the live site from main (.github/workflows/docs.yml).
# See https://docs.readthedocs.com/platform/stable/intro/zensical.html

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  jobs:
    install:
      # Keep in step with the zensical pin in pixi.toml.
      - pip install "zensical>=0.0.51,<0.0.52"
    build:
      html:
        # Previews live under a sub-path such as /en/12/, so build from a copy
        # of zensical.toml with site_url pointed at the preview.
        - python scripts/dev_config.py "$READTHEDOCS_CANONICAL_URL"
        - zensical build -f .zensical.serve.toml
    post_build:
      - mkdir -p "$READTHEDOCS_OUTPUT/html/"
      - cp --recursive site/* "$READTHEDOCS_OUTPUT/html/"
