name: Docs check

# Builds the site in strict mode, then checks the built pages offline with
# lychee. Zensical catches broken links between pages, but not broken nav
# entries or image paths, and lychee catches those in the built HTML.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: docs-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3

      - run: pixi run build

      # The flags override lychee.toml, which only covers external links in the
      # sources. site/ is gitignored, hence --no-ignore. 404.html uses absolute
      # /satyrn-zen/ paths, so it's skipped.
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --offline --no-ignore --extensions html --scheme file
            --root-dir site --exclude-path site/404.html
            site
