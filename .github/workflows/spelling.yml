name: Spelling

# Runs the hooks in prek.toml, so `pixi run lint` locally matches this run.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: spelling-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cspell:
    name: cspell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3

      - run: pixi run lint
