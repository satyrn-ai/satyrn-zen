name: Docs Preview
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
permissions:
  contents: write
  pull-requests: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 1. Build the Zensical site but don't auto-deploy to production
      - name: Zensical Build
        id: zensical
        uses: cssnr/zensical-action@fd73e847ab603a83970fc530a3a17c19fa19e407 # v1.0.8
        with:
          deploy: false # Prevents overwriting your live production site

      # 2. Deploy the built static files to a subfolder preview
      - name: Deploy PR Preview
        uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9 # v1.8.1
        with:
          source-dir: ./site # Zensical's default build folder output
          preview-branch: gh-pages
